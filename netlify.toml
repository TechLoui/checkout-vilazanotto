# Netlify — site institucional + checkout estático.
# O backend roda no Railway (pasta /server). O checkout fala com ele via
# window.VZ_CHECKOUT_API definido em checkout.html.

[build]
  publish = "dist"
  command = "rm -rf dist && mkdir -p dist && cp index.html checkout.html styles.css checkout.css site.js checkout.js robots.txt sitemap.xml dist/ && cp -R assets dist/assets"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
